dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    honorLabels: true
    additionalLabels:
      release: prometheus-stack

  # Ensure the exporter is looking for the Kubelet
  arguments: ["-k"]
  kubeletPath: "/var/lib/kubelet/pod-resources"

  env:
    - name: DCGM_EXPORTER_KUBERNETES
      value: "true"
    # Try 'device-name' first, then 'uid' if this fails
    - name: DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE
      value: "uid"

  # Explicit volume mounts to ensure the pod can reach the .sock file
  extraVolumeMounts:
    - name: pod-resources
      mountPath: /var/lib/kubelet/pod-resources
      readOnly: true
  extraVolumes:
    - name: pod-resources
      hostPath:
        path: /var/lib/kubelet/pod-resources

operator:
  defaultRuntime: containerd

apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-router
  namespace: ai-gateway

data:
  router.py: |
    from fastapi import FastAPI, Request
    import httpx
    import os

    app = FastAPI()

    # ----------------------------
    # SAFE KUBERNETES DNS HANDLER
    # ----------------------------
    def get_model_url(env_key: str, default_svc: str) -> str:
        val = os.getenv(env_key)

        if not val:
            return f"http://{default_svc}.ai-models.svc.cluster.local:8000"

        if ".svc.cluster.local" not in val:
            return f"http://{default_svc}.ai-models.svc.cluster.local:8000"

        return val

    # ----------------------------
    # MODEL ENDPOINTS
    # ----------------------------
    MISTRAL_BASE = get_model_url("MISTRAL_URL", "mistral-7b-svc")
    QWEN_BASE = get_model_url("QWEN_URL", "qwen-7b-svc")
    DEEPSEEK_BASE = get_model_url("DEEPSEEK_URL", "deepseek-coder-svc")

    # ----------------------------
    # SMART ROUTER LOGIC
    # ----------------------------
    def pick_model_base(prompt: str):
        p = prompt.lower()

        # 💻 Coding / DevOps / Debugging → DeepSeek
        if any(k in p for k in [
            "code", "debug", "error", "stack trace",
            "kubernetes", "docker", "yaml", "deployment",
            "bug", "fix", "cli", "bash"
        ]):
            return DEEPSEEK_BASE

        # 🧬 Biology / Medicine → Qwen
        if any(k in p for k in [
            "bio", "biology", "dna", "rna", "protein",
            "cell", "genome", "medical", "disease",
            "virus", "vaccine", "enzyme"
        ]):
            return QWEN_BASE

        # 🧪 Chemistry / Molecules → Mistral
        if any(k in p for k in [
            "chemistry", "chemical", "reaction",
            "compound", "molecule", "ligand",
            "pubchem", "structure"
        ]):
            return MISTRAL_BASE

        # default fallback
        return MISTRAL_BASE

    # ----------------------------
    # API ROUTE
    # ----------------------------
    @app.post("/v1/chat/completions")
    async def route_completions(request: Request):
        req_data = await request.json()

        user_prompt = req_data.get("messages", [{}])[0].get("content", "")

        base_url = pick_model_base(user_prompt)
        target_url = f"{base_url.rstrip('/')}/v1/chat/completions"

        async with httpx.AsyncClient(timeout=60.0) as client:
            response = await client.post(target_url, json=req_data)
            return response.json()

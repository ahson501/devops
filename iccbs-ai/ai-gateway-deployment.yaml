apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway

  template:
    metadata:
      labels:
        app: ai-gateway

    spec:
      containers:
      - name: gateway
        image: tiangolo/uvicorn-gunicorn-fastapi:python3.11

        command:
        - uvicorn
        - router:app
        - --host
        - "0.0.0.0"
        - --port
        - "8080"

        ports:
        - containerPort: 8080

        envFrom:
        - configMapRef:
            name: ai-gateway-config

        volumeMounts:
        - name: router-code
          mountPath: /app/router.py
          subPath: router.py

      volumes:
      - name: router-code
        configMap:
          name: ai-gateway-router

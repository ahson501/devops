apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-vllm
  namespace: ai-models

spec:
  replicas: 1

  selector:
    matchLabels:
      app: qwen-vllm

  template:
    metadata:
      labels:
        app: qwen-vllm

    spec:
      nodeSelector:
        kubernetes.io/hostname: ai-master

      containers:
      - name: qwen
        image: vllm/vllm-openai:v0.8.5
        imagePullPolicy: IfNotPresent
        args:
        - "--model"
        - "Qwen/Qwen2.5-3B-Instruct"
        - "--gpu-memory-utilization"
        - "0.85"
        - "--max-model-len"
        - "2048"
        - "--dtype"
        - "float16"

        ports:
        - containerPort: 8000

        resources:
          limits:
            nvidia.com/gpu: 1

        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface

      #volumes:
      #- name: model-cache
        #persistentVolumeClaim:
          #claimName: hf-model-cache

      volumes:
      - name: model-cache
        hostPath:
          path: /data/hf-cache
          type: DirectoryOrCreate


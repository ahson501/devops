auths:
  cisco_v2:
    version: 2
    community: ICCBS-RO

modules:
  cisco:
    walk:
      - 1.3.6.1.2.1.1
      - 1.3.6.1.2.1.2.2
      - 1.3.6.1.2.1.31.1.1
      - 1.3.6.1.4.1.9.9.109.1.1.1.1
      - 1.3.6.1.4.1.9.9.48.1.1.1
      - 1.3.6.1.4.1.9.9.13.1

    metrics:

      # ===== UPTIME =====
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge

      # ===== CPU =====
      - name: cpmCPUTotal5minRev
        oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.8
        type: gauge
        indexes:
          - labelname: cpu
            type: gauge

      # ===== MEMORY =====
      - name: ciscoMemoryPoolUsed
        oid: 1.3.6.1.4.1.9.9.48.1.1.1.5
        type: gauge
        indexes:
          - labelname: pool
            type: gauge

      - name: ciscoMemoryPoolFree
        oid: 1.3.6.1.4.1.9.9.48.1.1.1.6
        type: gauge
        indexes:
          - labelname: pool
            type: gauge

      # ===== TEMPERATURE =====
      - name: ciscoEnvMonTemperatureStatusValue
        oid: 1.3.6.1.4.1.9.9.13.1.3.1.3
        type: gauge
        indexes:
          - labelname: sensor
            type: gauge

      # ===== PSU =====
      - name: ciscoEnvMonSupplyState
        oid: 1.3.6.1.4.1.9.9.13.1.5.1.3
        type: gauge
        indexes:
          - labelname: supply
            type: gauge

      # ===== FAN =====
      - name: ciscoEnvMonFanState
        oid: 1.3.6.1.4.1.9.9.13.1.4.1.3
        type: gauge
        indexes:
          - labelname: fan
            type: gauge

      # ===== INTERFACE TRAFFIC =====
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      # ===== INTERFACE ERRORS =====
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge

      # ===== PORT STATUS =====
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: gauge


apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-copilot
  template:
    metadata:
      labels:
        app: ai-copilot
    spec:
      serviceAccountName: ai-copilot-sa
      containers:
        - name: ai-copilot
          image: registry-1.docker.io/ahsonlatif/ai-copilot:v5
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          command: ["uvicorn"]
          args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 30
            periodSeconds: 5

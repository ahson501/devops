# ============================================================
# agents-deployment.yaml
# Place in: jupyterhub_manifests/ai-copilot/k8s/
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-uploads-pvc
  namespace: ai-gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-service
  namespace: ai-gateway
  labels:
    app: agents-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents-service
  template:
    metadata:
      labels:
        app: agents-service
    spec:
      containers:
      - name: agents
        image: registry-1.docker.io/ahsonlatif/aiagent:v11
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: ai-gateway-config
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: MAX_TOKENS
          value: "1024"
        - name: TEMPERATURE
          value: "0.3"
        - name: LLM_TIMEOUT
          value: "120"
        - name: QDRANT_TOP_K
          value: "5"
        - name: EMBED_URL
          value: "http://embedding-bge-svc.ai-models.svc.cluster.local:80/embed"
        - name: UPLOAD_DIR
          value: "/data/research-uploads"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: upload-storage
          mountPath: /data/research-uploads
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: upload-storage
        persistentVolumeClaim:
          claimName: research-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agents-svc
  namespace: ai-gateway
spec:
  selector:
    app: agents-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
